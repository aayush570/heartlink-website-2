  <meta property="og:url" content="https://heartlink.in/contact">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Contact HeartLink | Private Matchmaking">
  <meta name="twitter:description" content="Contact HeartLink's private matchmaking team in Mumbai for family, applicant, matchmaker and adviser enquiries.">

  <link rel="canonical" href="https://heartlink.in/contact">
  <title>Contact HeartLink | Private Matchmaking</title>
  <link rel="icon" href="/Heartlink%20Logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Manrope:wght@300;400;500;600&amp;display=swap">
  <link rel="stylesheet" href="/styles.css?v=31">
</head>
<body>
  <header data-site-header></header>
  <main>
    <section class="page-hero compact-hero">
      <div class="hero-inner"><span class="eyebrow">Contact HeartLink</span><h1>Speak with us <span class="accent">privately.</span></h1><p class="hero-copy">Have a question before submitting a profile? Send a short enquiry and the right person will respond privately.</p></div>
    </section>
    <section class="section surface">
      <div class="section-narrow contact-direct" data-contact-methods></div>
      <div class="form-card section-narrow">
        <span class="eyebrow">General enquiry</span>
        <h2>How can we help?</h2>
        <p>Share your details and we will get back to you privately.</p>
        <form class="form-grid" data-submission-type="contact">
          <div class="field"><label for="name">Full name · Required</label><input id="name" name="name" autocomplete="name" required></div>
          <div class="field"><label for="email">Private email · Required</label><input id="email" name="email" type="email" autocomplete="email" required></div>
          <div class="field"><label for="phone">Phone / WhatsApp · Required</label><input id="phone" name="phone" type="tel" autocomplete="tel" required></div>
          <div class="field"><label for="enquiryRole">I am enquiring as · Required</label><select id="enquiryRole" name="enquiryRole" required><option value="">Select</option><option>Potential applicant</option><option>Parent or family representative</option><option>Partner matchmaker</option><option>Private-client adviser</option><option>Other</option></select></div>
          <div class="field field-full"><label for="message">What would you like to know?</label><textarea id="message" name="message" maxlength="1200"></textarea></div>
          <label class="consent"><input type="checkbox" name="consent" value="yes" required><span>I consent to HeartLink using these details to respond to my enquiry.</span></label>
          <button class="button" type="submit">Send Enquiry</button>
          <p class="form-status" role="alert" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>
  <footer data-site-footer></footer>
  <script type="module" src="/app.js?v=13"></script>
</body>
</html>
